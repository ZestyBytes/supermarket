# Publishes the built app to GitHub Pages, so it can be opened on a phone
# without checking the repo out. Enable Pages → "GitHub Actions" in repo
# settings for this to have somewhere to publish to.
#
# The hosted copy is the meal planner only. The live-basket half needs the
# local server that holds the session, and that never leaves one machine —
# the app detects a static build and says so rather than offering dead buttons.
name: Deploy to Pages

on:
  push:
    branches: [main, claude/first-version-built-xzviqu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
